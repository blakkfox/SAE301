<!-- Image principale : chargée tout de suite (pas de lazy-loading), c'est le
     plus grand élément visible de la page. Le fond gris tient lieu d'état de
     chargement. -->
<div class="aspect-square overflow-hidden rounded-xl bg-section">
  <img src="{{url}}" alt="{{name}}" width="1000" height="1000" fetchpriority="high" decoding="async" class="size-full object-cover" />
</div>
