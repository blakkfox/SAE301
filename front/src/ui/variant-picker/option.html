<!-- Le radio est masqué visuellement (sr-only) mais reste focalisable : le
     libellé porte le cadre, épaissi en gris anthracite quand il est coché.
     Une variante épuisée (STK-b) reste sélectionnable pour être consultée :
     fond gris, libellé grisé et barré (STATE_CLASSES dans index.js). Le point
     orange (OPT-b) signale une variante bientôt épuisée ; il est décoratif,
     le texte masqué porte l'information. -->
<label class="flex h-13 min-w-11 cursor-pointer flex-col items-center justify-center gap-0.75 rounded-lg border px-4 text-small font-semibold transition-colors hover:border-line-strong has-checked:border-2 has-checked:border-ink has-focus-visible:outline-2 has-focus-visible:outline-offset-2 has-focus-visible:outline-action {{stateClasses}}">
  <input type="radio" name="variant" value="{{id}}" data-focus-key="variant-{{id}}" class="sr-only" />
  <span>{{label}}<span class="sr-only">{{stockText}}</span></span>
  <span data-low-stock-dot aria-hidden="true" class="size-1.5 rounded-full bg-warning"></span>
</label>
