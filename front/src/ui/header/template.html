<header class="sticky top-0 z-20 border-b border-line-subtle bg-page">
  <!--
    Mobile First : sur petit écran, trois lignes (logo + compte + panier, puis
    recherche, puis navigation défilante). À partir de xl (1280 px), une seule
    ligne de 80 px comme sur la maquette. L'ordre visuel est réglé par order-*,
    l'ordre du HTML reste celui de la lecture au clavier sur grand écran.
  -->
  <!-- relative : le menu des catégories se place sous cette ligne. -->
  <div class="relative mx-auto flex max-w-360 flex-wrap items-center gap-x-6 gap-y-3 px-4 py-3 sm:px-6 lg:px-10 xl:h-20 xl:flex-nowrap xl:gap-10 xl:px-20 xl:py-0">
    <a href="/" data-link class="order-1 font-display text-[1.75rem] leading-none tracking-[0.04em] text-accent sm:text-[2.125rem]" aria-label="Honda Moto, retour au catalogue">HONDA</a>

    <!-- Le routeur pose aria-current="page" sur le lien de la page affichée. -->
    <nav aria-label="Navigation principale" class="order-4 -mx-4 w-[calc(100%+2rem)] overflow-x-auto px-4 sm:mx-0 sm:w-full sm:px-0 xl:order-2 xl:w-auto">
      <ul class="flex gap-6 text-base font-medium whitespace-nowrap sm:gap-8">
        <li><a href="/" data-link class="inline-block py-2 text-ink underline-offset-8 transition-colors hover:text-accent aria-[current=page]:text-accent aria-[current=page]:underline">Catalogue</a></li>
        <!-- Bouton et non lien : il ouvre le menu des catégories (DEC-a).
             aria-expanded est tenu à jour par le layout. -->
        <li>
          <button type="button" data-category-menu-button aria-expanded="false" aria-controls="category-menu" class="group inline-flex items-center gap-1 py-2 font-medium text-ink transition-colors hover:text-accent aria-expanded:text-accent">
            Catégories <span aria-hidden="true" class="inline-block transition-transform duration-200 group-aria-expanded:rotate-180 motion-reduce:transition-none">▾</span>
          </button>
        </li>
        <li><a href="/promotions" data-link class="inline-block py-2 text-ink underline-offset-8 transition-colors hover:text-accent aria-[current=page]:text-accent aria-[current=page]:underline">Promotions</a></li>
      </ul>
    </nav>

    <!-- Recherche : présente sur la maquette, mais aucune US ne la couvre.
         Le champ est désactivé plutôt que de faire semblant de fonctionner. -->
    <form role="search" class="order-3 w-full xl:ml-auto xl:w-75">
      <label class="flex h-10 items-center gap-2 rounded-full border border-line bg-section px-3.5 text-ink-muted">
        <span aria-hidden="true" class="text-lg leading-none">⌕</span>
        <span class="sr-only">Rechercher un produit (bientôt disponible)</span>
        <input type="search" name="q" placeholder="Rechercher un produit" disabled class="w-full min-w-0 bg-transparent text-[0.9375rem] placeholder:text-ink-muted disabled:cursor-not-allowed" />
      </label>
    </form>

    <div class="order-2 ml-auto flex items-center gap-4 sm:gap-6 xl:order-4 xl:ml-0 xl:gap-10">
      <a href="/compte" data-link class="text-base font-medium whitespace-nowrap text-ink transition-colors hover:text-accent">Mon compte</a>
      <a href="/panier" data-link class="rounded-full bg-action px-4 py-2.5 text-[0.9375rem] leading-none font-semibold whitespace-nowrap text-on-action transition-opacity hover:opacity-90">
        Panier (<span data-cart-count>0</span>)
      </a>
    </div>

    <slot name="category-menu"></slot>
  </div>
</header>
