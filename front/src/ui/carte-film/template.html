<article class="flex flex-col overflow-hidden rounded-lg border border-zinc-200 shadow-xs transition-colors hover:border-zinc-500 dark:border-zinc-800 dark:hover:border-zinc-400">
  <div class="bandeau-clair dark:bandeau-sombre flex h-20 items-start justify-end border-b border-zinc-200 p-2 dark:border-zinc-800" style="--teinte: {{teinte}}">
    <span class="rounded-full border border-zinc-200 bg-white px-1.5 text-[0.6875rem] font-medium text-zinc-500 dark:border-zinc-800 dark:bg-zinc-950 dark:text-zinc-400">{{genre}}</span>
  </div>

  <div class="flex-1 p-3.5">
    <h2 class="mb-0.5 text-[0.9375rem] leading-snug font-medium tracking-tight">{{titre}}</h2>
    <p class="mb-3 text-[0.8125rem] text-zinc-500 dark:text-zinc-400">{{realisateur}}</p>

    <div class="flex items-center gap-2.5 text-[0.8125rem] text-zinc-500 dark:text-zinc-400">
      <span class="font-semibold text-zinc-950 dark:text-zinc-50">{{note}}</span>
      <span>{{annee}}</span>
      <span>{{duree}}</span>
    </div>
  </div>
</article>
