<!-- Carte indicateur du tableau de bord (écran 10) et des statistiques (écran 20) :
     libellé, valeur, précision. La flèche de tendance est décorative : la
     précision écrite (« +8 % vs mois précédent ») porte l'information. -->
<div class="flex flex-col gap-2 rounded-xl bg-page px-5 py-6">
  <dt class="text-caption text-ink-muted">{{label}}</dt>
  <dd class="font-display text-h1-mobile leading-none {{tone}}">{{value}}</dd>
  <dd class="text-caption text-ink-muted"><span aria-hidden="true" class="{{trendClass}}">{{trendSymbol}}</span> {{caption}}</dd>
</div>
