     sont décoratifs (aria-hidden). -->

    <div class="aspect-card bg-section"></div>
    <div class="flex flex-col gap-3 p-4"><div class="h-5 w-3/4 rounded bg-section"></div><div class="h-6 w-1/3 rounded bg-section"></div><div class="h-12 rounded bg-section"></div></div>
  </div>
  <div aria-hidden="true" class="hidden animate-pulse flex-col overflow-hidden rounded-lg border border-line-subtle motion-reduce:animate-none sm:flex">
    <div class="aspect-card bg-section"></div>
    <div class="flex flex-col gap-3 p-4"><div class="h-5 w-3/4 rounded bg-section"></div><div class="h-6 w-1/3 rounded bg-section"></div><div class="h-12 rounded bg-section"></div></div>
  </div>
  <div aria-hidden="true" class="hidden animate-pulse flex-col overflow-hidden rounded-lg border border-line-subtle motion-reduce:animate-none lg:flex">
    <div class="aspect-card bg-section"></div>
    <div class="flex flex-col gap-3 p-4"><div class="h-5 w-3/4 rounded bg-section"></div><div class="h-6 w-1/3 rounded bg-section"></div><div class="h-12 rounded bg-section"></div></div>
  </div>
  <div aria-hidden="true" class="hidden animate-pulse flex-col overflow-hidden rounded-lg border border-line-subtle motion-reduce:animate-none xl:flex">
    <div class="aspect-card bg-section"></div>
    <div class="flex flex-col gap-3 p-4"><div class="h-5 w-3/4 rounded bg-section"></div><div class="h-6 w-1/3 rounded bg-section"></div><div class="h-12 rounded bg-section"></div></div>
  </div>
</div>
