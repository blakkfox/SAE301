<!--
  « J'ai déjà un compte » (écran 5, colonne de gauche). novalidate : c'est le
  serveur qui valide, et ses messages s'affichent sous les champs comme sur
  la maquette, au lieu des bulles du navigateur.
-->
<section aria-labelledby="login-title" class="flex flex-col gap-4 rounded-xl border border-line bg-page p-6 sm:p-7">
  <h2 id="login-title" class="font-display text-h3 leading-none text-ink">J’ai déjà un compte</h2>

  <form novalidate class="flex flex-col gap-4">
    <div class="flex flex-col gap-2">
      <label for="login-email" class="text-caption font-semibold text-ink">Adresse e-mail</label>
      <input id="login-email" name="email" type="email" autocomplete="email" required value="{{email}}" placeholder="nom@exemple.fr" aria-describedby="login-email-error" class="field" />
      <p id="login-email-error" data-error-for="email" hidden class="text-caption text-accent"></p>
    </div>

    <div class="flex flex-col gap-2">
      <label for="login-password" class="text-caption font-semibold text-ink">Mot de passe</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" required aria-describedby="login-password-error" class="field" />
      <p id="login-password-error" data-error-for="password" hidden class="text-caption text-accent"></p>
    </div>

    <!-- Bouton et non lien : il remplace ce bloc par le formulaire « Mot de passe oublié ». -->
    <button type="button" data-action="forgot-password" class="self-start text-caption font-medium text-link underline-offset-4 hover:underline">Mot de passe oublié ?</button>

    <button type="submit" class="button h-12 w-full px-6 text-small">{{submitLabel}}</button>
  </form>
</section>
