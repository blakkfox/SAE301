<section class="mb-6 rounded-lg border border-zinc-200 p-6 shadow-xs dark:border-zinc-800">
  <h2 class="mb-5 text-base font-semibold tracking-tight">Connexion</h2>

  <form class="flex flex-col gap-4">
    <label class="flex flex-col gap-2 text-sm font-medium">
      Identifiant
      <input name="login" type="text" autocomplete="username" value="{{login}}" class="h-9 rounded-md border border-zinc-200 bg-white px-3 font-normal transition-colors hover:border-zinc-500 dark:border-zinc-800 dark:bg-zinc-950 dark:hover:border-zinc-400" />
    </label>

    <label class="flex flex-col gap-2 text-sm font-medium">
      Mot de passe
      <input name="mdp" type="password" autocomplete="current-password" class="h-9 rounded-md border border-zinc-200 bg-white px-3 font-normal transition-colors hover:border-zinc-500 dark:border-zinc-800 dark:bg-zinc-950 dark:hover:border-zinc-400" />
    </label>

    <div class="flex flex-wrap gap-3">
      <button type="submit" class="h-9 rounded-md bg-zinc-900 px-4 text-sm font-medium text-zinc-50 transition-opacity hover:opacity-90 dark:bg-zinc-50 dark:text-zinc-900">
        Se connecter
      </button>
      <!-- type « button » et non « submit » : ce bouton n'envoie pas le formulaire. -->
      <button type="button" data-action="deconnexion" class="h-9 rounded-md border border-zinc-200 px-4 text-sm font-medium transition-colors hover:bg-zinc-100 dark:border-zinc-800 dark:hover:bg-zinc-800">
        Se déconnecter
      </button>
    </div>
  </form>
</section>
