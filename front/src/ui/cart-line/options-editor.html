<!--
  Modification des options d'une ligne (US OPT-a) : les cases à cocher de la
  fiche produit (ui/product-options), puis « Terminer ». Chaque case cochée
  met aussitôt à jour le prix de la ligne et le récapitulatif.
-->
<div class="flex flex-col items-start gap-3 self-stretch">
  <slot name="editor"></slot>
  <button type="button" data-options-close data-focus-key="options" class="button button--outline h-10 px-5 text-small">Terminer</button>
</div>
