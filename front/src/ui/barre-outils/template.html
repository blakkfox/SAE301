<div class="mb-6 flex flex-wrap items-end gap-4 rounded-lg border border-zinc-200 p-4 dark:border-zinc-800">
  <label class="flex flex-col gap-2 text-sm font-medium">
    Trier par
    <select name="tri" class="h-9 min-w-44 rounded-md border border-zinc-200 bg-white px-3 font-normal transition-colors hover:border-zinc-500 dark:border-zinc-800 dark:bg-zinc-950 dark:hover:border-zinc-400">
      <option value="titre">Titre (A → Z)</option>
      <option value="annee">Année (récents d'abord)</option>
      <option value="note">Note (meilleurs d'abord)</option>
    </select>
  </label>

  <label class="flex flex-col gap-2 text-sm font-medium">
    Films par page
    <select name="parPage" class="h-9 min-w-44 rounded-md border border-zinc-200 bg-white px-3 font-normal transition-colors hover:border-zinc-500 dark:border-zinc-800 dark:bg-zinc-950 dark:hover:border-zinc-400">
      <option value="12">12 films</option>
      <option value="24">24 films</option>
      <option value="48">48 films</option>
    </select>
  </label>

  <span class="ml-auto text-sm text-zinc-500 dark:text-zinc-400">{{total}} films</span>
</div>
