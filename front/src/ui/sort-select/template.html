<!-- Les valeurs des options sont les clés de la liste blanche du serveur
     (CatalogueController::SORTS) : une autre valeur serait ignorée. -->
<label class="relative flex h-12 w-full items-center gap-3 rounded-lg border border-line bg-page px-4 transition-colors hover:border-line-strong sm:w-auto">
  <span class="text-small whitespace-nowrap text-ink-muted">Trier par :</span>
  <select name="sort" class="min-w-0 flex-1 appearance-none bg-transparent pr-6 text-small font-semibold text-ink disabled:cursor-wait">
    <option value="price_asc">Prix croissant</option>
    <option value="price_desc">Prix décroissant</option>
    <option value="name_asc">Nom (A → Z)</option>
    <option value="newest">Nouveautés</option>
  </select>
  <span aria-hidden="true" class="pointer-events-none absolute right-4 text-sm text-ink">▾</span>
</label>
