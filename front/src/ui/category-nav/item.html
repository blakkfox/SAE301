<!-- Une catégorie et son nombre de produits. La catégorie en cours reçoit
     data-active="true" (voir index.js) : fond rouge Honda, texte blanc.
     Le nombre est lu en entier par les lecteurs d'écran (« 4 produits »). -->
<li class="shrink-0">
  <a href="{{url}}" data-link data-active="false" class="group flex items-center justify-between gap-4 rounded-md px-3 py-2.5 text-[0.9375rem] whitespace-nowrap text-ink transition-colors hover:bg-page data-[active=true]:bg-action data-[active=true]:font-semibold data-[active=true]:text-on-action">
    <span>{{label}}</span>
    <span aria-hidden="true" class="text-sm text-ink-muted group-data-[active=true]:text-on-action">{{count}}</span>
    <span class="sr-only">, {{countLabel}}</span>
  </a>
</li>
