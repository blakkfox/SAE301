<!-- Ratio 9/7 = 282 × 220 px de la maquette. Le fond gris tient lieu d'état de
     chargement tant que l'image n'est pas arrivée ; width/height réservent la
     place et évitent que la grille ne saute au chargement. -->
<div class="aspect-[9/7] overflow-hidden bg-section">
  <img src="{{imageUrl}}" alt="{{name}}" width="1000" height="1000" loading="lazy" decoding="async" class="size-full object-cover transition-transform duration-300 group-hover:scale-105 motion-reduce:transition-none" />
</div>
