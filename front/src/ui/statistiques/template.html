<section class="mb-6 rounded-lg border border-zinc-200 p-6 shadow-xs dark:border-zinc-800">
  <h2 class="mb-5 text-base font-semibold tracking-tight">Statistiques du catalogue</h2>

  <div class="grid grid-cols-[repeat(auto-fit,minmax(140px,1fr))] gap-4">
    <div class="rounded-md border border-zinc-200 p-4 dark:border-zinc-800">
      <div class="text-2xl leading-tight font-semibold tracking-tight">{{total}}</div>
      <div class="text-[0.8125rem] text-zinc-500 dark:text-zinc-400">films</div>
    </div>
    <div class="rounded-md border border-zinc-200 p-4 dark:border-zinc-800">
      <div class="text-2xl leading-tight font-semibold tracking-tight">{{noteMoyenne}}</div>
      <div class="text-[0.8125rem] text-zinc-500 dark:text-zinc-400">note moyenne</div>
    </div>
    <div class="rounded-md border border-zinc-200 p-4 dark:border-zinc-800">
      <div class="text-2xl leading-tight font-semibold tracking-tight">{{dureeMoyenne}}</div>
      <div class="text-[0.8125rem] text-zinc-500 dark:text-zinc-400">durée moyenne</div>
    </div>
  </div>

  <ul class="mt-6 divide-y divide-zinc-200 text-sm dark:divide-zinc-800">
    <slot name="genres"></slot>
  </ul>
</section>
