<li class="flex min-w-0 flex-col gap-2">
  <span class="sr-only">{{description}}</span>
  <div aria-hidden="true" class="flex flex-1 flex-col items-center justify-end gap-1.5">
    <span class="text-micro whitespace-nowrap text-ink-muted sm:text-caption">{{amount}}</span>
    <span class="chart-bar {{barClass}}" style="--_size: {{size}}%"></span>
  </div>
  <span aria-hidden="true" class="text-center text-micro text-ink-muted sm:text-caption">{{day}}</span>
</li>
