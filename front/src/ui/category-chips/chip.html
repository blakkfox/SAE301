<!-- Pastille de sous-catégorie. Celle de la page affichée reçoit
     data-active="true" (voir index.js) : fond gris anthracite, texte blanc. -->
<li>
  <a href="{{url}}" data-link data-active="false" class="inline-flex h-9 items-center gap-2 rounded-full border border-line-strong bg-page px-4 text-small font-semibold text-ink transition-colors hover:border-ink data-[active=true]:border-ink data-[active=true]:bg-ink data-[active=true]:text-ink-inverse">
    <span>{{label}}</span>
    <span aria-hidden="true" class="text-sm font-normal">{{count}}</span>
    <span class="sr-only">, {{countLabel}}</span>
  </a>
</li>
