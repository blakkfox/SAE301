<!-- Une ligne de la liste. Les slots reçoivent la photo, la pastille de
     stock (StockBadgeView) et le statut de publication (page.js). -->
<tr>
  <th scope="row" class="py-3 pr-3 pl-5 font-semibold">
    <span class="flex items-center gap-3">
      <slot name="image"></slot>
      <span>{{name}}</span>
    </span>
  </th>
  <td class="px-3 py-3">{{category}}</td>
  <td class="px-3 py-3 text-right whitespace-nowrap">{{price}}</td>
  <td class="px-3 py-3 text-right whitespace-nowrap">{{stock}}<span class="block text-caption text-ink-muted">{{variants}}</span></td>
  <td class="px-3 py-3"><slot name="stock"></slot></td>
  <td class="px-3 py-3"><slot name="status"></slot></td>
  <td class="px-3 py-3 whitespace-nowrap">
    <a href="/admin/produits/{{id}}" data-link class="text-small text-link underline-offset-4 hover:underline">Modifier<span class="sr-only"> {{name}}</span></a>
  </td>
</tr>
