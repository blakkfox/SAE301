<!-- Créneau : le bouton radio est masqué, la pastille (fond anthracite si choisie) porte le style et l'anneau de focus. -->
<label class="cursor-pointer">
  <input type="radio" name="slot" value="{{id}}" data-focus-key="slot-{{id}}" class="peer sr-only" />
  <span class="block rounded-lg border border-line bg-page px-4 py-3 text-small text-ink transition-colors peer-checked:border-ink peer-checked:bg-ink peer-checked:font-semibold peer-checked:text-ink-inverse peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-action hover:border-line-strong">{{label}}</span>
</label>
