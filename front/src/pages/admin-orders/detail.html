<!--
  Détail d'une commande (écran 11, colonne de droite) : client, articles,
  total, action suivante du cycle, annulation et journal.
-->
<aside aria-labelledby="order-detail-title" aria-busy="false" class="flex flex-col gap-5 rounded-xl bg-page p-6">
  <div class="flex flex-col gap-3">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <h2 id="order-detail-title" tabindex="-1" class="font-display text-h4 leading-none text-ink">Commande {{number}}</h2>
      <slot name="status"></slot>
    </div>
    <p class="text-caption text-ink-muted">{{customerLine}}</p>
  </div>

  <ul data-detail-lines class="flex flex-col gap-3"></ul>

  <p class="flex items-baseline justify-between gap-4 border-t border-line-subtle pt-4 text-ink">
    <span class="text-base font-semibold">Total</span>
    <span class="font-display text-h4 leading-none">{{total}}</span>
  </p>

  <div class="flex flex-col gap-3">
    <button type="button" data-action="advance" data-focus-key="advance" class="button h-12 w-full px-6 text-small">{{advanceLabel}}</button>
    <button type="button" data-action="ask-cancel" data-focus-key="ask-cancel" class="button button--outline h-12 w-full px-6 text-small">Annuler la commande</button>
  </div>

  <p class="text-caption text-ink-muted">{{journal}}</p>

  <slot name="confirm"></slot>
</aside>
