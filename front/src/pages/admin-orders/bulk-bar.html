<!-- Actions groupées sur les commandes cochées (écran 11). -->
<div class="flex flex-col gap-3 rounded-xl bg-page p-4 sm:flex-row sm:items-center sm:justify-between sm:px-5">
  <p role="status" class="text-small font-semibold text-ink">{{selectionLabel}}</p>
  <div class="flex flex-col gap-3 sm:flex-row">
    <button type="button" data-action="bulk" data-status="disponible" data-focus-key="bulk-disponible" class="button h-12 px-6 text-small">Passer à « disponible »</button>
    <button type="button" data-action="bulk" data-status="retiree" data-focus-key="bulk-retiree" class="button button--outline h-12 px-6 text-small">Passer à « retirée »</button>
  </div>
</div>
