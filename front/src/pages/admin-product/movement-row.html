<!-- {{quantityClass}} : rouge pour une baisse, gris anthracite pour une hausse. -->
<li class="flex items-baseline gap-4">
  <span class="w-22 shrink-0 text-caption text-ink-muted tabular-nums">{{date}}</span>
  <span class="min-w-0 flex-1">{{label}}</span>
  <span class="shrink-0 font-semibold tabular-nums {{quantityClass}}"><span class="sr-only">{{quantityLabel}}</span><span aria-hidden="true">{{quantity}}</span></span>
</li>
