<!-- Options du produit (US OPT-c). Défile horizontalement sur petit écran. -->
<div class="relative overflow-x-auto rounded-lg border border-line">
  <table class="w-full min-w-(--size-admin-options-table-min) text-left text-small text-ink">
    <caption class="sr-only">{{caption}}</caption>
    <thead class="bg-section text-caption font-semibold text-ink-muted">
      <tr>
        <th scope="col" class="px-4 py-3">Option</th>
        <th scope="col" class="px-3 py-3">Description</th>
        <th scope="col" class="px-3 py-3">Supplément (€)</th>
        <th scope="col" class="px-3 py-3"><span class="sr-only">Retirer</span></th>
      </tr>
    </thead>
    <tbody data-option-rows class="divide-y divide-line-subtle"></tbody>
  </table>
</div>
