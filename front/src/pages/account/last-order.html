<!-- « Ma dernière commande » : résumé, statut, lien vers sa page pour la commander
     à nouveau (SUI-a) et lien vers l'historique (SUI-c). -->
<section aria-labelledby="last-order-title" class="flex flex-col gap-4 rounded-xl bg-page p-6 md:flex-row md:items-center md:justify-between">
  <div class="flex min-w-0 flex-col gap-1.5">
    <h2 id="last-order-title" class="text-lg font-semibold text-ink">Ma dernière commande</h2>
    <p class="flex flex-wrap items-center gap-x-3 gap-y-2 text-small text-ink-muted">
      <span>{{summary}}</span>
      <slot name="status"></slot>
    </p>
  </div>
  <div class="flex shrink-0 flex-wrap items-center gap-x-5 gap-y-3">
    <a href="/compte/commandes/{{id}}" data-link class="button button--outline h-11 px-5 text-small">Commander à nouveau<span class="sr-only"> la commande {{number}}</span></a>
    <a href="/compte/commandes" data-link class="text-small font-medium whitespace-nowrap text-link underline-offset-4 hover:underline">Toutes mes commandes <span aria-hidden="true">→</span></a>
  </div>
</section>
