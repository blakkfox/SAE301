<!-- Grille à côté de la colonne des catégories : 3 cartes au plus (maquette :
     900 px de large), contre 4 pour la grille pleine largeur du catalogue.
     Mobile First : 1 colonne, 2 dès 640 px, 3 à 1280 px. -->
<div class="grid grid-cols-1 gap-6 sm:grid-cols-2 xl:grid-cols-3">
  <slot name="cards"></slot>
  <!-- Confirmation d'ajout au panier depuis une carte, pour les lecteurs
       d'écran (sr-only est en position absolue : pas de case de grille). -->
  <p data-grid-status role="status" class="sr-only"></p>
</div>
