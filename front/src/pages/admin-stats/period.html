<!-- Pastille de période. Celle appliquée reçoit aria-pressed="true" (voir
     page.js) : fond gris anthracite, texte blanc. -->
<li>
  <button type="button" data-period="{{period}}" data-focus-key="period-{{period}}" class="inline-flex h-9 items-center rounded-full border border-line-strong bg-page px-4 text-small font-semibold text-ink transition-colors hover:border-ink aria-pressed:border-ink aria-pressed:bg-ink aria-pressed:text-ink-inverse">{{label}}</button>
</li>
