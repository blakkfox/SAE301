<!-- Détail d'une commande : articles et total, retrait, suivi des statuts (journal de PIL-b). -->
<div class="grid gap-6 rounded-lg bg-section p-5 md:grid-cols-2 md:gap-10">
  <div class="flex flex-col gap-3">
    <h3 class="text-caption font-semibold text-ink-muted">Articles</h3>
    <ul data-detail-lines class="flex flex-col gap-2"></ul>
    <p class="flex items-baseline justify-between gap-4 border-t border-line pt-3">
      <span class="font-semibold">{{totalLabel}}</span>
      <span class="shrink-0 font-semibold">{{total}}</span>
    </p>
  </div>
  <div class="flex flex-col gap-5">
    <div class="flex flex-col gap-2">
      <h3 class="text-caption font-semibold text-ink-muted">Retrait</h3>
      <p>{{pickup}}</p>
    </div>
    <div class="flex flex-col gap-3">
      <h3 class="text-caption font-semibold text-ink-muted">Suivi de la commande</h3>
      <ol data-detail-events class="flex flex-col gap-2"></ol>
    </div>
  </div>
</div>
