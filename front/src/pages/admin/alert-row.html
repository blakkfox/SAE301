<!-- Le point de couleur est décoratif : la quantité écrite porte l'information. -->
<li class="flex items-center justify-between gap-4 text-small">
  <span class="flex min-w-0 items-center gap-3 text-ink">
    <span aria-hidden="true" class="size-2 shrink-0 rounded-full {{dotClass}}"></span>
    {{name}}
  </span>
  <span class="shrink-0 text-caption font-semibold {{quantityClass}}">{{quantity}}</span>
</li>
