<!-- Défile horizontalement sur petit écran plutôt que de casser ses colonnes. -->
<div class="relative overflow-x-auto rounded-xl bg-page">
  <table class="w-full min-w-(--size-admin-categories-table-min) text-left text-small text-ink">
    <caption class="sr-only">{{caption}}</caption>
    <thead class="bg-section text-caption font-semibold text-ink-muted">
      <tr>
        <th scope="col" class="px-5 py-3">Nom</th>
        <th scope="col" class="px-3 py-3">Produits</th>
        <th scope="col" class="px-3 py-3">Visibilité</th>
        <th scope="col" class="px-3 py-3">Actions</th>
      </tr>
    </thead>
    <tbody data-category-rows class="divide-y divide-line-subtle"></tbody>
  </table>
</div>
