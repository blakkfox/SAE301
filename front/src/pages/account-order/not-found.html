<!-- Commande inexistante, ou passée par un autre compte (l'API répond 404 dans les deux cas). -->
<div class="flex min-w-0 flex-col gap-6">
  <h1 tabindex="-1" class="font-display text-h1-mobile leading-none text-ink outline-none sm:text-h1 sm:leading-h1">Commande introuvable</h1>
  <div data-order-notice class="empty:hidden"></div>
  <div class="flex flex-col items-start gap-4 rounded-xl bg-page p-6">
    <p role="status" class="text-small text-ink">Cette commande n’existe pas ou n’appartient pas à votre compte.</p>
    <a href="/compte/commandes" data-link class="button h-12 px-6 text-small">Voir mes commandes</a>
  </div>
</div>
