<!--
  Récapitulatif (400 px dès 1024 px). Pas encore de champ « Code promo » (PRO-a).
-->
<section aria-labelledby="cart-summary-title" class="flex flex-col gap-4 rounded-xl bg-page p-6 sm:p-7">
  <h2 id="cart-summary-title" class="font-display text-h3 leading-none text-ink">Récapitulatif</h2>

  <dl class="flex flex-col gap-4 text-small">
    <div class="flex justify-between gap-4">
      <dt class="text-ink-muted">{{subtotalTitle}} ({{subtotalLabel}})</dt>
      <dd class="font-semibold text-ink">{{subtotal}}</dd>
    </div>
    <!-- Remise de la promotion automatique (écran 4, PRO-c), déjà déduite du
         sous-total : retirée sans produit en promotion. -->
    <div data-summary-promo class="flex justify-between gap-4">
      <dt class="text-ink-muted">{{promoLabel}}</dt>
      <dd class="font-semibold text-accent">{{promo}}</dd>
    </div>
    <!-- Suppléments des options cochées (écran 17, OPT-a), retirée sans option. -->
    <div data-summary-options class="flex justify-between gap-4">
      <dt class="text-ink-muted">Options</dt>
      <dd class="font-semibold text-ink">{{options}}</dd>
    </div>
    <div class="flex justify-between gap-4">
      <dt class="text-ink-muted">Retrait en concession</dt>
      <!-- La maquette écrit « Gratuit » en vert Statut/Succès, trop peu
           contrasté pour un texte de 15 px : il reste en gris anthracite. -->
      <dd class="font-semibold text-ink">Gratuit</dd>
    </div>
  </dl>

  <hr class="border-line-subtle" />

  <p class="flex justify-between gap-4 text-xl font-bold text-ink"><span>Total</span><span>{{total}}</span></p>

  <!-- Validation de la commande (CMD-a, écran 6) : la page /commande demande
       la connexion si besoin. Avec un article épuisé (STK-c, écran 8), le
       lien est retiré au profit du bouton désactivé, et la note dit pourquoi. -->
  <a href="/commande" data-link data-checkout-link aria-describedby="cart-summary-note" class="button h-12 w-full px-6 text-base">Valider la commande</a>
  <button type="button" disabled data-checkout-blocked aria-describedby="cart-summary-note" class="button h-12 w-full px-6 text-base">Valider la commande</button>

  <p id="cart-summary-note" class="text-caption text-ink-muted">{{note}}</p>
  <p data-summary-options-note class="text-caption text-ink-muted">{{optionsNote}}</p>
</section>
