<!-- Défile horizontalement sur petit écran plutôt que de casser ses colonnes. -->
<div class="overflow-x-auto rounded-xl bg-page">
  <table class="w-full min-w-(--size-admin-promo-codes-table-min) text-left text-small text-ink">
    <caption class="sr-only">{{caption}}</caption>
    <thead class="bg-section text-caption font-semibold text-ink-muted">
      <tr>
        <th scope="col" class="px-5 py-3">Code</th>
        <th scope="col" class="px-3 py-3">Remise</th>
        <th scope="col" class="px-3 py-3">Validité</th>
        <th scope="col" class="px-3 py-3">Utilisé</th>
        <th scope="col" class="px-3 py-3">Statut</th>
        <th scope="col" class="px-3 py-3">Actions</th>
      </tr>
    </thead>
    <tbody data-promo-rows class="divide-y divide-line-subtle"></tbody>
  </table>
</div>
